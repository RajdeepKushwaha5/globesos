name: Lingo.dev Auto-Translation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "i18n/locales/en.json"
      - "components/**/*.tsx"
      - "app/**/*.tsx"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  translate:
    name: Extract & Translate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract translations
        run: node i18n/scripts/extract-lingo.js

      - name: Install Lingo.dev CLI
        run: npm install -g lingo.dev

      - name: Translate with Lingo.dev
        env:
          LINGO_API_KEY: ${{ secrets.LINGO_API_KEY }}
        run: |
          # Translate to all supported languages
          lingo translate \
            --input i18n/locales/en.json \
            --output-pattern "i18n/locales/{locale}.json" \
            --locales es,fr,ru,de,ja,zh,ar,ko \
            --context "emergency_response" \
            --glossary "GlobeSoS=GlobeSoS,SOS=SOS,Responder=Responder"

      - name: Verify translations
        run: |
          echo "Verifying translation files..."
          for locale in es fr ru de ja zh ar ko; do
            if [ -f "i18n/locales/$locale.json" ]; then
              echo "✅ $locale.json exists"
              node -e "JSON.parse(require('fs').readFileSync('i18n/locales/$locale.json', 'utf8'))"
              echo "✅ $locale.json is valid JSON"
            else
              echo "❌ $locale.json missing"
              exit 1
            fi
          done

      - name: Create Pull Request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(i18n): auto-translate strings with Lingo.dev"
          title: "🌐 Auto-translated strings (Lingo.dev)"
          body: |
            ## Auto-Generated Translations

            This PR contains automatically translated strings using Lingo.dev.

            ### Changes
            - ✅ Extracted source strings from codebase
            - ✅ Translated to 8 languages (es, fr, ru, de, ja, zh, ar, ko)
            - ✅ Validated JSON integrity

            ### Translation Stats
            ```
            Total keys: $(node -e "console.log(Object.keys(require('./i18n/locales/en.json')).length)")
            Languages: 9 (including English)
            Provider: Lingo.dev
            ```

            ### Review Checklist
            - [ ] Verify translations are contextually accurate
            - [ ] Check RTL layout for Arabic
            - [ ] Test language switcher
            - [ ] Validate emergency terminology

            ---
            🤖 Generated by Lingo.dev GitHub Action
          branch: lingo-auto-translate
          delete-branch: true
          labels: |
            i18n
            automated
            lingo.dev

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🌐 **Lingo.dev Translation Check**\n\n✅ All translations extracted and validated successfully!\n\nPowered by [Lingo.dev](https://lingo.dev)'
            })

  quality-check:
    name: Translation Quality Check
    runs-on: ubuntu-latest
    needs: translate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for untranslated keys
        run: |
          node -e "
          const fs = require('fs');
          const en = JSON.parse(fs.readFileSync('i18n/locales/en.json', 'utf8'));
          const locales = ['es', 'fr', 'ru', 'de', 'ja', 'zh', 'ar', 'ko'];

          let hasErrors = false;

          for (const locale of locales) {
            const trans = JSON.parse(fs.readFileSync(\`i18n/locales/\${locale}.json\`, 'utf8'));
            const missing = Object.keys(en).filter(k => !trans[k]);
            
            if (missing.length > 0) {
              console.error(\`❌ \${locale}: Missing \${missing.length} keys\`);
              console.error(\`   Keys: \${missing.slice(0, 5).join(', ')}...\`);
              hasErrors = true;
            } else {
              console.log(\`✅ \${locale}: All keys present\`);
            }
          }

          if (hasErrors) {
            process.exit(1);
          }
          "

      - name: Check translation completion percentage
        run: |
          node -e "
          const fs = require('fs');
          const en = JSON.parse(fs.readFileSync('i18n/locales/en.json', 'utf8'));
          const enKeys = Object.keys(en).length;

          console.log('📊 Translation Coverage:');
          console.log('========================');

          ['es', 'fr', 'ru', 'de', 'ja', 'zh', 'ar', 'ko'].forEach(locale => {
            const trans = JSON.parse(fs.readFileSync(\`i18n/locales/\${locale}.json\`, 'utf8'));
            const coverage = (Object.keys(trans).length / enKeys * 100).toFixed(1);
            console.log(\`\${locale.toUpperCase()}: \${coverage}%\`);
          });
          "
