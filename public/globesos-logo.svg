<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sosGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Globe background -->
  <circle cx="16" cy="16" r="14" fill="url(#globeGradient)" stroke="#1e40af" stroke-width="1"/>

  <!-- Globe meridians -->
  <ellipse cx="16" cy="16" rx="14" ry="6" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
  <ellipse cx="16" cy="16" rx="14" ry="10" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="16" cy="16" rx="6" ry="14" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
  <ellipse cx="16" cy="16" rx="10" ry="14" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>

  <!-- Vertical lines -->
  <line x1="16" y1="2" x2="16" y2="30" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
  <line x1="2" y1="16" x2="30" y2="16" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>

  <!-- SOS Text -->
  <text x="16" y="20" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="url(#sosGradient)">SOS</text>

  <!-- Emergency cross -->
  <g transform="translate(16,16)">
    <rect x="-1" y="-6" width="2" height="12" fill="#ffffff"/>
    <rect x="-6" y="-1" width="12" height="2" fill="#ffffff"/>
  </g>
</svg>