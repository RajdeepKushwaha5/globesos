<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sosGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Globe background -->
  <circle cx="16" cy="16" r="15" fill="url(#globeGradient)"/>

  <!-- Globe meridians -->
  <ellipse cx="16" cy="16" rx="15" ry="7" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
  <ellipse cx="16" cy="16" rx="15" ry="11" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
  <ellipse cx="16" cy="16" rx="7" ry="15" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
  <ellipse cx="16" cy="16" rx="11" ry="15" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>

  <!-- Vertical lines -->
  <line x1="16" y1="1" x2="16" y2="31" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
  <line x1="1" y1="16" x2="31" y2="16" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>

  <!-- SOS Text -->
  <text x="16" y="21" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="url(#sosGradient)">SOS</text>

  <!-- Emergency cross -->
  <g transform="translate(16,16)">
    <rect x="-1" y="-7" width="2" height="14" fill="#ffffff"/>
    <rect x="-7" y="-1" width="14" height="2" fill="#ffffff"/>
  </g>
</svg>